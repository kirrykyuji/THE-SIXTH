<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE SIXTH</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:#000;font-family:-apple-system,"SF Pro Text",system-ui,Roboto,sans-serif;color:#fff;display:flex;justify-content:center;height:100dvh;overflow:hidden}
#ph{position:relative;width:min(100vw,430px);height:100dvh;max-height:900px;margin:auto;overflow:hidden;background:#111}
@media(min-width:500px){#ph{border-radius:48px;border:6px solid #222;height:min(100dvh,880px)}}
section,.app,#ov{position:absolute;inset:0}
#wall{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,#5b5560 0,#26242b 45%,#0b0b0e 100%);background-size:cover;background-position:center}
#wall:after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,#0000 30%,#0009)}
#sb{position:absolute;top:0;left:0;right:0;height:46px;padding:14px 28px 0;display:flex;justify-content:space-between;font-weight:600;font-size:15px;z-index:50;pointer-events:none}
#sb .r{display:flex;gap:6px;align-items:center;font-size:13px}
#isl{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:60}
.bat{width:24px;height:12px;border:1.5px solid #fffa;border-radius:4px;padding:1px}.bat i{display:block;height:100%;width:78%;background:#fff;border-radius:2px}
.bars{display:flex;gap:2px;align-items:flex-end}.bars i{width:3px;background:#fff;border-radius:1px}
/* LOCK */
#lock{transition:transform .6s cubic-bezier(.7,0,.3,1),opacity .6s;z-index:30}
#lock.up{transform:translateY(-100%);opacity:0}
#lock .c{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;text-align:center;padding:96px 0 44px;--k:clamp(54px,8.8dvh,76px)}
#lock .d{font-size:18px;opacity:.9;margin-bottom:10px}#lock .t{font-size:clamp(66px,10dvh,86px);font-weight:300;line-height:1.05;letter-spacing:-2px;text-shadow:0 2px 12px #0006}
#msg{font-size:17px;margin-bottom:12px}#hint{font-size:12px;opacity:.8;margin:24px 24px 0;min-height:30px}
.dots{display:flex;gap:18px;justify-content:center;margin:16px 0 30px}
.dots i{width:13px;height:13px;border:1.5px solid #fff;border-radius:50%}.dots i.f{background:#fff}
.dots.sh{animation:sh .45s}@keyframes sh{20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
.pad{display:grid;grid-template-columns:repeat(3,var(--k));gap:clamp(12px,2.3dvh,22px) 26px;justify-content:center}
.k{height:var(--k);border-radius:50%;background:#ffffff26;backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:300;cursor:pointer;user-select:none}
.k small{font-size:9px;letter-spacing:2px;margin-top:-2px}.k:active{background:#ffffff66}.k.x{background:none;font-size:17px}
/* HOME */
#ph{--pw:min(100vw,430px);--ic:min(calc(var(--pw)*.165),9.3dvh)}
#home{padding:66px calc(var(--pw)*.04) 0;z-index:5}
.g{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:calc(var(--ic)*1.2);gap:calc(var(--ic)*.12) 0;justify-items:center;align-items:center}
.ia{position:relative;width:var(--ic);height:var(--ic);cursor:pointer}
.ic{width:100%;height:100%;border-radius:22.4%;overflow:hidden;box-shadow:0 1px 4px #0003}.ic svg{display:block;width:100%;height:100%}
.wdg{justify-self:stretch;align-self:stretch;margin:0 calc((var(--pw)*.23 - var(--ic))/2);border-radius:calc(var(--ic)*.5);overflow:hidden;cursor:pointer;background-size:cover;background-position:center;position:relative;box-shadow:0 1px 6px #0004}.wdg svg{width:100%;height:100%;display:block}
.bd{position:absolute;top:-6px;right:-6px;background:#ff3b30;border-radius:10px;min-width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px;z-index:2}
#dock{position:absolute;bottom:calc(var(--ic)*.3);left:calc(var(--pw)*.035);right:calc(var(--pw)*.035);background:#ffffff3d;backdrop-filter:blur(26px);border-radius:calc(var(--ic)*.52);padding:calc(var(--ic)*.2);display:flex;justify-content:space-around}
#hb{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#fff;opacity:.85;z-index:80;cursor:pointer}
#ban{position:absolute;top:50px;left:10px;right:10px;background:#f2f2f7f2;color:#111;border-radius:24px;padding:12px 14px;z-index:70;transform:translateY(-150%);transition:transform .5s;font-size:14px;cursor:pointer;display:flex;gap:10px;align-items:center;backdrop-filter:blur(20px)}
#ban.on{transform:none}#ban b{display:block;font-size:13px}#ban div:nth-child(2){flex:1}#ban small{opacity:.5}.bi{width:42px;height:42px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;background:#fff;flex:none}.bi svg{width:100%;height:100%}
/* APP */
.app{background:#000;z-index:40;transform:translateX(100%);transition:transform .35s;display:flex;flex-direction:column;padding-top:52px}
.app.on{transform:none}
#hd{display:flex;align-items:center;padding:6px 14px 10px;border-bottom:1px solid #222;font-weight:600;font-size:17px}
#hd button{background:none;border:0;color:#0a84ff;font-size:17px;width:70px;text-align:left}#hd span{flex:1;text-align:center}#hd i{width:70px}
#ab{flex:1;overflow-y:auto;padding-bottom:30px}
.row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #1c1c1e;align-items:center;cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.row div:nth-child(2){flex:1;min-width:0}.row b{display:block}.row p{font-size:13px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{opacity:.5;font-size:12px}
.chat{padding:12px 12px 8px;display:flex;flex-direction:column;gap:5px}
.b{max-width:76%;padding:9px 13px;border-radius:19px;font-size:15px;line-height:1.35;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.l{background:#262629;align-self:flex-start}.me{background:#0a84ff;align-self:flex-end}
.nm{font-size:11px;opacity:.55;margin:6px 0 -2px 10px}.st{font-size:11px;opacity:.5;align-self:flex-end;margin-right:6px}.st.er{color:#ff453a;opacity:1}
.sep{text-align:center;font-size:11px;opacity:.5;margin:10px 0 4px}
.nar{align-self:center;text-align:center;font-style:italic;font-size:13px;opacity:.75;padding:8px 20px;background:#ffffff12;border-radius:14px;margin:6px 0}
#cb{padding:8px 12px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid #222}
.o{background:#0a84ff;border:0;color:#fff;border-radius:20px;padding:12px;font-size:14.5px;cursor:pointer;animation:pop .3s}
.o.alt{background:#2c2c2e}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.th{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:38px;cursor:pointer}.th small{font-size:10px;opacity:.8;margin-top:4px}
.view{padding:18px}.view .big{aspect-ratio:1;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:90px;margin-bottom:14px}
.cal{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid #1c1c1e}.cal .dt{width:52px;text-align:center;background:#1c1c1e;border-radius:12px;padding:6px 0}.cal .dt b{display:block;font-size:22px}.cal .dt small{color:#ff453a;font-size:11px}
.nt{padding:16px;border-bottom:1px solid #1c1c1e}.nt small{opacity:.5;display:block;margin-bottom:4px}.nt p{font-size:15px;line-height:1.5}
#ov{z-index:90;display:none;flex-direction:column;background:linear-gradient(#1b2a3a,#050608);padding:90px 24px 40px;text-align:center}
#ov.on{display:flex}#ov h2{font-size:34px;font-weight:300}#ov .s{opacity:.6;margin:6px 0 20px}
#tx{flex:1;overflow-y:auto;text-align:left;display:flex;flex-direction:column;gap:10px}
#tx p{background:#ffffff14;border-radius:14px;padding:10px 14px;font-size:14.5px;line-height:1.4;animation:pop .3s}#tx p b{display:block;font-size:11px;opacity:.6}
#tx p.rk{background:#0a84ff55}
#cc{display:flex;flex-direction:column;gap:8px;margin-top:12px}
</style></head><body>
